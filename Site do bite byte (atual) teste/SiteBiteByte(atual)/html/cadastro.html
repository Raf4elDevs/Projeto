<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiteByte | Acesso</title>
    <link rel="icon" type="image/svg+xml" href="../assets/ICON.BITEBYTE (2).svg">
    <!-- Fontes e Ícones -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Estilos do projeto -->
    <link rel="stylesheet" href="../css/cadastro.css">
</head>
<body>
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>

    <main class="glass-wrapper">
        <div class="glass-container">
            
            <aside class="glass-sidebar">
                <h1 class="logo" id="logo-home" style="cursor: pointer;">Bite<span>Byte</span></h1>
                
                <nav class="auth-menu">
                    <button id="tab-login" class="auth-tab active" data-target="login" type="button">Conta / Entrar</button>
                    <button id="tab-register" class="auth-tab" data-target="register" type="button">Nova Conta</button>
                </nav>
                
                <div class="sidebar-footer">
                    <a href="index.html"><i class="fas fa-arrow-left"></i> Voltar ao site</a>
                    <a href="admin.html" class="admin-quick-link" aria-label="Ir para administração" title="Administração">
                        <i class="fas fa-user-shield"></i>
                    </a>
                </div>
            </aside>

            <section class="glass-content">
                <div id="alerta-msg" class="alerta oculta"></div>

                <!-- Formulário de Login -->
                <form id="form-login" class="auth-form active">
                    <h2>Entrar na Conta</h2>
                    <p class="subtitle">Acesse para gerenciar suas receitas.</p>
                    
                    <div class="form-list">
                        <div class="list-item">
                            <label for="login-email">E-mail</label>
                            <input type="email" id="login-email" placeholder="seu.email@exemplo.com" required autocomplete="email">
                        </div>
                        <div class="list-item">
                            <label for="login-senha">Senha</label>
                            <div class="input-with-icon">
                                <input type="password" id="login-senha" placeholder="••••••••" required autocomplete="current-password">
                                <i class="fas fa-eye toggle-password" data-target="login-senha" role="button" aria-label="Mostrar senha"></i>
                            </div>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn-glass">Entrar</button>
                </form>

                <!-- Formulário de Cadastro (Etapa 1) -->
                <form id="form-register" class="auth-form">
                    <h2>Informações Básicas</h2>
                    <p class="subtitle">Crie seu perfil no BiteByte.</p>
                    
                    <div class="form-list">
                        <div class="list-item">
                            <label for="reg-nome">Nome</label>
                            <input type="text" id="reg-nome" placeholder="Seu nome completo" required minlength="3" autocomplete="name">
                        </div>
                        <div class="list-item">
                            <label for="reg-email">E-mail</label>
                            <input type="email" id="reg-email" placeholder="seu.email@exemplo.com" required autocomplete="email">
                        </div>
                        <div class="list-item">
                            <label for="reg-senha">Senha</label>
                            <div class="input-with-icon">
                                <input type="password" id="reg-senha" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password">
                                <i class="fas fa-eye toggle-password" data-target="reg-senha" role="button" aria-label="Mostrar senha"></i>
                            </div>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn-glass">Salvar Perfil</button>
                </form>

                <!-- Formulário de Onboarding (Etapa 2 - Preferências para IA) -->
                <form id="form-onboarding" class="auth-form">
                    <h2>Deixe ao seu gosto:</h2>
                    <p class="subtitle">Selecione suas preferências para a nossa IA criar o cardápio perfeito.</p>
                    
                    <div class="form-list" style="max-height: 450px; overflow-y: auto; padding-right: 10px;">
                        
                        <div class="list-item">
                            <label for="onb-tempo">Quanto tempo costuma ter para cozinhar?</label>
                            <select id="onb-tempo" class="select-clean">
                                <option value="ate-15">Até 15 min</option>
                                <option value="15-30">15–30 min</option>
                                <option value="30-60">30–60 min</option>
                                <option value="mais-1h">Mais de 1h</option>
                            </select>
                        </div>

                        <div class="list-item">
                            <label for="onb-habilidade">Qual nível de habilidade você tem na cozinha?</label>
                            <select id="onb-habilidade" class="select-clean">
                                <option value="iniciante">Iniciante</option>
                                <option value="intermediario">Intermediário</option>
                                <option value="avancado">Avançado</option>
                            </select>
                        </div>

                        <div class="list-item">
                            <label for="onb-orcamento">Qual sua faixa de orçamento para alimentação?</label>
                            <select id="onb-orcamento" class="select-clean">
                                <option value="economico">Econômico</option>
                                <option value="medio">Médio</option>
                                <option value="alto">Alto</option>
                            </select>
                        </div>

                        <div class="list-item">
                            <label for="onb-preferencia-sabor">Você prefere doces ou salgados?</label>
                            <select id="onb-preferencia-sabor" class="select-clean">
                                <option value="doces">Doces</option>
                                <option value="salgados">Salgados</option>
                            </select>
                        </div>

                        <div class="list-item">
                            <label for="onb-experimentar">Você gosta de experimentar comidas novas?</label>
                            <select id="onb-experimentar" class="select-clean">
                                <option value="sim">Sim</option>
                                <option value="as-vezes">Às vezes</option>
                                <option value="nao">Não</option>
                            </select>
                        </div>

                        <div class="list-item">
                            <label for="onb-estilo-receita">Você prefere receitas:</label>
                            <select id="onb-estilo-receita" class="select-clean">
                                <option value="simples">Simples</option>
                                <option value="rapidas">Rápidas</option>
                                <option value="economicas">Econômicas</option>
                                <option value="saudaveis">Saudáveis</option>
                                <option value="sofisticadas">Sofisticadas</option>
                                <option value="tradicionais">Tradicionais</option>
                            </select>
                        </div>

                        <div class="list-item">
                            <label for="onb-culinaria">Quais culinárias você mais gosta?</label>
                            <select id="onb-culinaria" class="select-clean">
                                <option value="brasileira">Brasileira</option>
                                <option value="italiana">Italiana</option>
                                <option value="japonesa">Japonesa</option>
                                <option value="coreana">Coreana</option>
                                <option value="mexicana">Mexicana</option>
                                <option value="arabe">Árabe</option>
                                <option value="americana">Americana</option>
                            </select>
                        </div>

                        <div class="list-item">
                            <label for="onb-dieta">Você segue alguma dieta?</label>
                            <select id="onb-dieta" class="select-clean">
                                <option value="nenhuma">Nenhuma</option>
                                <option value="low-carb">Low carb</option>
                                <option value="cetogenica">Cetogênica</option>
                                <option value="vegetariana">Vegetariana</option>
                                <option value="vegana">Vegana</option>
                                <option value="sem-gluten">Sem glúten</option>
                                <option value="sem-lactose">Sem lactose</option>
                                <option value="hipocalorica">Hipocalórica</option>
                            </select>
                        </div>

                        <div class="list-item">
                            <label for="onb-objetivo">Qual seu objetivo alimentar?</label>
                            <select id="onb-objetivo" class="select-clean">
                                <option value="emagrecer">Emagrecer</option>
                                <option value="massa-muscular">Ganhar massa muscular</option>
                                <option value="saudavel">Comer de forma mais saudável</option>
                                <option value="economizar">Economizar nas refeições</option>
                                <option value="gostosas">Comer comidas gostosas</option>
                                <option value="descobrir">Descobrir receitas novas</option>
                                <option value="praticidade">Praticidade no dia a dia</option>
                                <option value="aprender">Aprender a cozinhar</option>
                            </select>
                        </div>

                        <div class="list-item">
                            <label for="onb-paladar">Você gosta de comidas:</label>
                            <select id="onb-paladar" class="select-clean">
                                <option value="picantes">Picantes</option>
                                <option value="doces">Doces</option>
                                <option value="azedas">Azedas</option>
                                <option value="bem-temperadas">Bem temperadas</option>
                            </select>
                        </div>

                        <div class="list-item">
                            <label for="onb-possui-alergia">Você possui alergias ou intolerâncias?</label>
                            <select id="onb-possui-alergia" class="select-clean">
                                <option value="nao">Não</option>
                                <option value="sim">Sim</option>
                            </select>
                        </div>

                        <div id="wrapper-alergias" class="list-item oculta">
                            <label for="onb-qual-alergia">Qual alergia ou intolerância você possui?</label>
                            <select id="onb-qual-alergia" class="select-clean">
                                <option value="lactose">Intolerância à Lactose</option>
                                <option value="gluten">Doença Celíaca / Glúten</option>
                                <option value="amendoim">Amendoim / Castanhas</option>
                                <option value="frutos-do-mar">Frutos do Mar</option>
                                <option value="ovos">Ovos</option>
                                <option value="soja">Soja</option>
                                <option value="outra">Outra (Informar ao BiteByte)</option>
                            </select> 
                        </div>

                    </div>
                    
                    <button type="submit" class="btn-glass">Concluir e Cozinhar!</button>
                </form>
            </section>
        </div>
    </main>

    <script src="../js/cadastro.js"></script>
</body>
</html>
